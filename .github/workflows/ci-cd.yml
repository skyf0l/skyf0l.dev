name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - run: bun install
      - run: bun run format:check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - run: bun install
      - run: bun run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: bun install
      # Not `bun run test`: bun shims `node` inside scripts, and vitest's worker
      # pools are unimplemented in bun. Run vitest with real node instead.
      - run: npx --no-install vitest --run

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - run: bun install
      - run: bun run build

  publish:
    runs-on: ubuntu-latest
    needs: [format, lint, test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write # GitHub OIDC -> Vault (jwt role bound to this repo + main)
    env:
      VAULT_ADDR: https://vault.tail.skyf0l.dev
      HEADSCALE_URL: https://headscale.skyf0l.dev
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Vault is tailnet-only: join Headscale as an ephemeral tag:ci node, whose
      # ACL reaches the Vault proxy only. The push itself goes to the public
      # registry host.
      - name: Join tailnet (Headscale)
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.HEADSCALE_CI_AUTHKEY }}
          hostname: gha-skyf0l-dev
          args: --login-server=${{ env.HEADSCALE_URL }} --accept-dns

      # One read mints one Harbor robot (push+pull on the skyf0l.dev project,
      # 15m lease). vault-action reads a path once, so both keys are the same robot.
      - name: Harbor push credentials (Vault)
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ env.VAULT_ADDR }}
          method: jwt
          role: skyf0l-dev-harbor-push
          exportToken: true
          secrets: |
            harbor/creds/skyf0l-dev-push robot_account_name | HARBOR_USERNAME ;
            harbor/creds/skyf0l-dev-push robot_account_secret | HARBOR_PASSWORD ;

      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.HARBOR_REGISTRY }}
          username: ${{ env.HARBOR_USERNAME }}
          password: ${{ env.HARBOR_PASSWORD }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.HARBOR_REGISTRY }}/${{ vars.HARBOR_PROJECT }}/skyf0l.dev
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Revoking the token cascades to its lease: Vault deletes the robot.
      - name: Revoke Vault token
        if: always() && env.VAULT_TOKEN != ''
        run: |
          curl -fsS -X POST -H "X-Vault-Token: ${VAULT_TOKEN}" "${VAULT_ADDR}/v1/auth/token/revoke-self"
